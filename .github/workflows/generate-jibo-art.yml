name: Verify transparent 3D Jibo WebP art

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/res/drawable-nodpi/jibo_art_*.webp'
      - 'scripts/verify_jibo_assets.py'
      - '.github/workflows/generate-jibo-art.yml'
  pull_request:
    paths:
      - 'app/src/main/res/drawable-nodpi/jibo_art_*.webp'
      - 'scripts/verify_jibo_assets.py'
      - '.github/workflows/generate-jibo-art.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image inspector
        run: python -m pip install 'Pillow==12.0.0'
      - name: Verify 12 individual transparent WebP resources
        run: python scripts/verify_jibo_assets.py
