name: Generate transparent Jibo WebP art

on:
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_jibo_assets.py'
      - '.github/workflows/generate-jibo-art.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jibik-art-export-main
  cancel-in-progress: false

jobs:
  export-art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic image exporters
        run: python -m pip install 'Pillow==12.0.0' 'CairoSVG==2.8.2'
      - name: Reconstruct verified editable generator
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/bootstrap_jibo_assets.py; then
            python scripts/bootstrap_jibo_assets.py
          fi
          test -f scripts/generate_jibo_assets.py
      - name: Render transparent WebP resources
        run: python scripts/generate_jibo_assets.py
      - name: Verify all 12 resources and transparent canvas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=sorted(Path('app/src/main/res/drawable-nodpi').glob('jibo_art_*.webp'))
          assert len(files)==12, f'Expected 12 resources, found {len(files)}'
          for path in files:
              im=Image.open(path)
              assert im.format=='WEBP', path
              assert im.mode=='RGBA', path
              assert im.size==(384,384), path
              assert im.getchannel('A').getpixel((0,0))==0, path
              assert im.getchannel('A').getextrema()==(0,255), path
              assert path.stat().st_size<45000, (path,path.stat().st_size)
              print(path.name, path.stat().st_size)
          PY
      - name: Commit generated WebP and human-readable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate_jibo_assets.py app/src/main/res/drawable-nodpi/jibo_art_*.webp
          if test -f scripts/bootstrap_jibo_assets.py; then
            git rm -f scripts/bootstrap_jibo_assets.py
          fi
          if git diff --cached --quiet; then
            echo 'No asset changes'
            exit 0
          fi
          git commit -m 'feat(art): add 12 verified transparent Jibo WebP assets'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'WebP art committed to main'
              exit 0
            fi
            sleep 3
          done
          echo 'Could not publish assets after three attempts' >&2
          exit 1
