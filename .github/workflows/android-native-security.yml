name: Android native encryption pilot

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '**/*.gradle.kts'
      - '.github/workflows/android-native-security.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - '**/*.gradle.kts'
      - '.github/workflows/android-native-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encryption-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native SQLCipher and Android Keystore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-security-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 14
