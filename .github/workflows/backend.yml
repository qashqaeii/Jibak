name: Jibik Django API CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jibik_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: jibik_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jibik_ci -d jibik_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JIBIK_DEBUG: "true"
      JIBIK_SECRET_KEY: "temporary-ci-key-not-for-production"
      JIBIK_DB_HOST: "localhost"
      JIBIK_DB_NAME: "jibik_ci"
      JIBIK_DB_USER: "jibik_ci"
      JIBIK_DB_PASSWORD: "ci_only_password"
      JIBIK_DB_SSLMODE: "disable"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Verify committed migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run database migrations
        run: python manage.py migrate --noinput
      - name: Security and finance API tests
        run: python -m pytest finance/tests.py finance/test_ai_mobile.py -q
