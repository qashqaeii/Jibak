name: Android CI — Jibik

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify shared Jibik UI consistency
        run: python3 scripts/verify_ui_consistency.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          gradle --no-daemon :core:finance:test :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee ci-diagnostics/gradle-build.log
      - name: Upload test and build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Jibik-ci-diagnostics
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/problems/**
            **/build/outputs/logs/**
            ci-diagnostics/gradle-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify APK output and generate SHA-256 checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one debug APK, found ${#apks[@]}"
            exit 1
          fi
          test -s "${apks[0]}"
          # Temporary no-SMS test build must not request restricted permissions.
          permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "${apks[0]}")"
          if printf '%s\\n' "$permissions" | grep -Eq 'android.permission.(READ_SMS|RECEIVE_SMS)'; then
            echo "::error::Sensitive SMS permission leaked into test APK" >&2
            exit 1
          fi
          # Verify embedded offline Persian typography is actually packaged.
          apk_contents="$(unzip -Z1 "${apks[0]}")"
          for weight in regular medium semibold bold extrabold; do
            test -s "app/src/main/res/font/vazirmatn_${weight}.ttf"
            if ! printf '%s\\n' "$apk_contents" | grep -Fq "res/font/vazirmatn_${weight}.ttf"; then
              echo "::error::Missing bundled Vazirmatn ${weight} in APK" >&2
              exit 1
            fi
          done
          echo "APK SMS permissions and embedded Persian fonts verified"
          sha256sum "${apks[0]}" > "${apks[0]}.sha256"
          echo "APK size: $(stat -c %s "${apks[0]}") bytes"
          cat "${apks[0]}.sha256"
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jibik-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
  verify-export-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested crypto dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - name: Verify encrypted CSV decryptor and tamper resistance
        run: python -m unittest discover -s scripts -p 'test_decrypt_jibik_csv.py' -v
