name: Android CI — Jibik

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug APK
        run: gradle --no-daemon :core:finance:test :app:assembleDebug --stacktrace
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jibik-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
