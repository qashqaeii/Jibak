name: Android CI — Jibik

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify shared Jibik UI consistency
        run: python3 scripts/verify_ui_consistency.py
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure persistent test-channel signing (trusted main only)
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          UPDATE_KEYSTORE: ${{ secrets.JIBIK_UPDATE_KEYSTORE_B64 }}
          EXPECTED_CERT: ${{ vars.JIBIK_UPDATE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$UPDATE_KEYSTORE" && -z "$EXPECTED_CERT" ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ephemeral debug signing; this APK is not a verified in-place update."
            exit 0
          fi
          test -n "$UPDATE_KEYSTORE" && test -n "$EXPECTED_CERT"
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$UPDATE_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          actual="$(keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | sha256sum | cut -d' ' -f1)"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]] || { echo "::error::Update signing certificate mismatch"; exit 1; }
          echo "stable=true" >> "$GITHUB_OUTPUT"
          echo "cert=$actual" >> "$GITHUB_OUTPUT"
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          gradle --no-daemon :core:finance:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee ci-diagnostics/gradle-build.log
      - name: Upload test and build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Jibik-ci-diagnostics
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**
            **/build/reports/problems/**
            **/build/outputs/logs/**
            ci-diagnostics/gradle-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify APK output and generate SHA-256 checksum
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one debug APK, found ${#apks[@]}"
            exit 1
          fi
          test -s "${apks[0]}"
          # The direct-install APK must not request restricted message access.
          permissions="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "${apks[0]}")"
          if grep -Eq 'android.permission.(READ_SMS|RECEIVE_SMS|SEND_SMS|RECEIVE_MMS|RECEIVE_WAP_PUSH|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE)' <<< "$permissions"; then
            echo "::error::Unexpected sensitive message or service permission" >&2
            exit 1
          fi
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apks[0]}")"
          grep -q "^package: name='ir.jibik.app' " <<< "$badging"
          manifest="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "${apks[0]}" AndroidManifest.xml)"
          if grep -Eq 'BankSmsReceiver|BankAutoReplyReceiver|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE' <<< "$manifest"; then
            echo "::error::Unexpected sensitive message receiver/service" >&2
            exit 1
          fi
          grep -Fq 'android.intent.action.SEND' <<< "$manifest"
          grep -Fq 'text/plain' <<< "$manifest"
          # Verify embedded offline Persian typography is actually packaged.
          apk_contents="$(unzip -Z1 "${apks[0]}")"
          for weight in regular medium semibold bold extrabold; do
            test -s "app/src/main/res/font/vazirmatn_${weight}.ttf"
            if ! printf '%s\\n' "$apk_contents" | grep -Fq "res/font/vazirmatn_${weight}.ttf"; then
              echo "::error::Missing bundled Vazirmatn ${weight} in APK" >&2
              exit 1
            fi
          done
          echo "APK user-shared text entry, absence of restricted SMS access and embedded Persian fonts verified"
          signer="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${apks[0]}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [[ "$signer" =~ ^[0-9a-fA-F]{64}$ ]]
          stable="${{ steps.signing.outputs.stable }}"
          if [[ "$stable" == true ]]; then
            [[ "$signer" == "${{ steps.signing.outputs.cert }}" ]] || { echo "::error::APK signer differs from pinned certificate"; exit 1; }
          fi
          {
            echo "applicationId=ir.jibik.app"
            echo "certificateSha256=$signer"
            echo "persistentSigningVerified=${stable:-false}"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "${apks[0]}" | sed -n '1p'
          } > app/build/outputs/apk/debug/update-identity.txt
          if [[ "$stable" != true ]]; then
            echo "Development APK only: fresh installation; in-place updates are not guaranteed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Persistent test-channel signing verified. Prior APK must have the same certificate." >> "$GITHUB_STEP_SUMMARY"
          fi
          sha256sum "${apks[0]}" > "${apks[0]}.sha256"
          echo "APK size: $(stat -c %s "${apks[0]}") bytes"
          cat "${apks[0]}.sha256"
      - name: Prepare single complete offline APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          [[ ${#apks[@]} == 1 ]]
          mkdir -p dist
          cp "${apks[0]}" dist/Jibik.apk
          cp app/build/outputs/apk/debug/update-identity.txt dist/
          (cd dist && sha256sum Jibik.apk > Jibik.apk.sha256)
          echo "Download Jibik-APK (one APK with offline banking via user-shared text; no automatic SMS access)." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload single Jibik APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jibik-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove injected private signing key
        if: always() && steps.signing.outcome != 'skipped'
        run: rm -f "$HOME/.android/debug.keystore"
  verify-export-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tested crypto dependency
        run: python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
      - name: Verify encrypted CSV decryptor and tamper resistance
        run: python -m unittest discover -s scripts -p 'test_decrypt_jibik_csv.py' -v
